# Edge function deploy settings (added 2026-10-21, daily_backend).
# Every function is deployed with verify_jwt = false: each one does its own
# auth (anon-callable endpoints with per-IP rate limits, or a shared secret for
# seed-cache/db-maintenance). Declaring it here means a bare
# `supabase functions deploy <name>` (CLI or the deploy-functions workflow)
# can never silently flip a function to verify_jwt = true and break callers.
# scripts/check-deploy-config.ts fails CI if a function dir is missing here.

[functions.analyze-novel]
verify_jwt = false

[functions.db-maintenance]
verify_jwt = false

[functions.dna-consensus]
verify_jwt = false

[functions.health]
verify_jwt = false

