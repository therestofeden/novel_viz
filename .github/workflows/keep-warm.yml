name: Keep Edge Functions Warm

# Pings edge functions every 5 minutes to prevent Supabase cold starts
# (~1-2s penalty) on the first real request.
# - The 4 Gemini functions (analyze-novel, takeaways, recommend-anti-shelf,
#   recommend-by-dna) return 200 immediately on {is_warmup:true} — no DB or
#   Gemini calls are made.
# - dna-consensus also supports {is_warmup:true} (added 2026-07-02) but was
#   never added here until 2026-08-21 — found during a backend audit.
# - search-books (GET) and popular-books (GET) have no is_warmup flag, but
#   both have genuinely free paths: search-books short-circuits to
#   `{results: []}` for any query under 2 chars (a blank q= ping costs
#   nothing — no OL/GB/DB calls), and popular-books either serves its
#   in-memory memo (free) or, on a true cold isolate, runs its normal DB
#   scan once — which also means this ping keeps the memo itself fresh for
#   the next real user, not just the isolate warm.
# - search-books and popular-books are the two highest-frequency,
#   most latency-sensitive endpoints in the app (autocomplete-driven) and
#   were the only public-facing functions with zero warm-keeping until this
#   pass — added 2026-08-21 daily backend audit.
#
# Setup required (one-time):
#   GitHub → repo Settings → Secrets and variables → Actions → New repository secret
#   Name: SUPABASE_ANON_KEY
#   Value: the anon/publishable key from your Supabase project (already in your .env)
#
# 2026-08-27 (daily backend agent): also fires db-maintenance (search_cache/
# rate_limit_events/etc purge) from here, in addition to its own
# nightly-maintenance.yml cron. Root cause: querying live data found
# search_cache and rate_limit_events had accumulated rows well past their own
# purge thresholds (24h / 7d) despite nightly-maintenance.yml showing 15/15
# consecutive daily "success" runs — then a direct GitHub API check showed its
# last actual run was >28h before this one, a full scheduled slot silently
# skipped. Piggybacking on this cron (originally assumed to fire ~24x/day)
# was meant to turn one flaky trigger into many redundant opportunities.
#
# 2026-09-01 (daily backend agent): the original fix above gated the
# db-maintenance call to only fire on minute 00-04 of each hour, on the
# assumption this cron actually runs every 5 minutes as scheduled (`*/5`).
# Pulled the real run history via the GitHub API (100 most recent runs,
# 2026-08-24 to 2026-09-01): average gap between runs was ~115 minutes, max
# gap ~700 minutes (11.6h), NOT ~5 minutes — GitHub Actions' `schedule`
# trigger is well-documented as best-effort/delayable, and in practice this
# repo's */5 cron behaves more like a ~12x/day cron. With only ~12 real
# firings/day and each one independently landing in the minute-00-04 window
# only ~8% of the time (5/60), the gate was mathematically throwing away
# ~92% of an already-scarce trigger — live-querying rate_limit_events
# confirmed this: 14 of 116 rows (12%) were already past the 7-day purge
# threshold, i.e. the "hourly backstop" wasn't meaningfully more reliable
# than nightly-maintenance.yml alone, contrary to its own stated intent.
# Removed the minute gate entirely — db-maintenance now fires on every
# keep-warm run, whatever that run's real-world cadence turns out to be.
# Safe regardless of how often this actually fires: the purge RPCs are
# idempotent (a purge with nothing stale to delete is a harmless no-op)
# against small tables, so there's no cost to calling it on every firing
# instead of gating it. Kept nightly-maintenance.yml as-is — this is
# additive redundancy, not a replacement.

on:
  schedule:
    # Every 5 minutes. GitHub Actions may delay by a minute or two — that's fine.
    - cron: "*/5 * * * *"
  workflow_dispatch: # allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping analyze-novel
        run: |
          curl -sf -o /dev/null \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"is_warmup":true}' \
            https://ecsublyvcvzdkvggxwlh.supabase.co/functions/v1/analyze-novel
        continue-on-error: true

      - name: Ping takeaways
        run: |
          curl -sf -o /dev/null \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"is_warmup":true}' \
            https://ecsublyvcvzdkvggxwlh.supabase.co/functions/v1/takeaways
        continue-on-error: true

      - name: Ping recommend-anti-shelf
        run: |
          curl -sf -o /dev/null \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"is_warmup":true}' \
            https://ecsublyvcvzdkvggxwlh.supabase.co/functions/v1/recommend-anti-shelf
        continue-on-error: true

      - name: Ping recommend-by-dna
        run: |
          curl -sf -o /dev/null \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"is_warmup":true}' \
            https://ecsublyvcvzdkvggxwlh.supabase.co/functions/v1/recommend-by-dna
        continue-on-error: true

      - name: Ping dna-consensus
        run: |
          curl -sf -o /dev/null \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"is_warmup":true}' \
            https://ecsublyvcvzdkvggxwlh.supabase.co/functions/v1/dna-consensus
        continue-on-error: true

      - name: Ping search-books
        run: |
          curl -sf -o /dev/null \
            -G \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --data-urlencode "q=" \
            https://ecsublyvcvzdkvggxwlh.supabase.co/functions/v1/search-books
        continue-on-error: true

      - name: Ping popular-books
        run: |
          curl -sf -o /dev/null \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            https://ecsublyvcvzdkvggxwlh.supabase.co/functions/v1/popular-books
        continue-on-error: true

      - name: Run db-maintenance (redundant backstop for nightly-maintenance.yml)
        # Fires on every run of this workflow, whatever cadence GitHub
        # actually delivers for the schedule trigger (see comment at top of
        # file — empirically ~12x/day, not the nominal 288x/day). No minute
        # gating: the purge RPCs are idempotent no-ops when nothing is stale,
        # so there's no downside to calling this every time instead of trying
        # to throttle an already-scarce, unreliable trigger.
        run: |
          curl -sf -o /dev/null \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-maintenance-secret: ${{ secrets.MAINTENANCE_SECRET }}" \
            https://ecsublyvcvzdkvggxwlh.supabase.co/functions/v1/db-maintenance
        continue-on-error: true
