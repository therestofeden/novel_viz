name: Nightly DB Maintenance

# Purges stale rows from search_cache (>24h old) and rate_limit_events (>7d old)
# by calling the db-maintenance edge function once a night. This replaces the
# old "1% of requests" opportunistic purge, which could go weeks without
# running on a heavily-cached table. pg_cron isn't available on this Supabase
# plan tier, so GitHub Actions cron (already used for keep-warm.yml) does the
# scheduling instead.
#
# Setup required (one-time):
#   1. Pick any random string, e.g. `openssl rand -hex 32`.
#   2. Supabase Dashboard → Project Settings → Edge Functions → Secrets:
#        add MAINTENANCE_SECRET = <that string>
#   3. GitHub → repo Settings → Secrets and variables → Actions:
#        add MAINTENANCE_SECRET = <same string>
#        (SUPABASE_ANON_KEY should already exist from keep-warm.yml setup)

on:
  schedule:
    # 03:00 UTC nightly — quiet-hours for most of this app's user base.
    - cron: "0 3 * * *"
  workflow_dispatch: # allow manual trigger for testing

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run db-maintenance
        # --max-time 110: db-maintenance/index.ts (2026-09-21) now bounds each
        # of its 6 sequential purge RPCs at 15s, so its own worst-case
        # response time is ~90-100s including cold-start/network overhead.
        # 110s gives curl its own ceiling with margin, below this job's
        # 2-minute timeout-minutes, so a hung connection surfaces as a clean
        # curl timeout in the log instead of relying solely on the external
        # job-level kill (which logs no request-level diagnostics at all).
        run: |
          curl -sf --max-time 110 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-maintenance-secret: ${{ secrets.MAINTENANCE_SECRET }}" \
            https://ecsublyvcvzdkvggxwlh.supabase.co/functions/v1/db-maintenance

  # 2026-11-09 (daily_backend): public-key exposure guard. Reads every
  # server-only / per-user table over /rest/v1 with the public anon key and
  # fails the run if any of them returns rows. Pass = 401/403/404 or `[]`.
  # Added after the 10-27 private_server_caches migration was reported as
  # live but was not: this turns that class of mistake into a red nightly run.
  exposure-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Anon key must not read private tables
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BASE: https://ecsublyvcvzdkvggxwlh.supabase.co/rest/v1
        run: |
          fail=0
          for t in search_cache dna_recommendation_cache takeaway_questions_cache \
                   gemini_daily_spend gemini_model_circuit gemini_account_alert \
                   rate_limit_events canon_books seed_book_list app_events \
                   client_errors feedback profiles shelves shelf_books \
                   shelf_recommendations shelf_clusters shelf_cluster_members \
                   book_takeaways book_overrides pinned_characters \
                   recommendation_blocks recommendation_feedback; do
            code=$(curl -s --max-time 10 -o body.json -w '%{http_code}' \
              "$BASE/$t?select=*&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            body=$(tr -d '[:space:]' < body.json)
            if [ "$code" = "200" ] && [ "$body" != "[]" ]; then
              echo "::error::EXPOSED: $t is readable with the public key"; fail=1
            else
              echo "ok  $t ($code)"
            fi
          done
          exit $fail
