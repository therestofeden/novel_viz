name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy client-side values so the build never depends on secrets.
          # Real values are injected at deploy time, not in CI.
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co

  edge-functions-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Added 2026-09-25 (daily_backend audit), acting on the 2026-09-24
      # audit's closing recommendation. Every prior instance of this bug
      # class (2026-09-19, 09-23, 09-24 — most recently takeaways/index.ts's
      # 4 unguarded blocking DB calls, silently untouched by every earlier
      # "full sweep") was found by a human/agent grepping by hand, a full
      # audit cycle after it landed. This runs the same check on every push
      # and PR instead, first (fast, no network) so a reintroduced gap fails
      # CI the same day it lands. See scripts/check-timeout-guards.ts for
      # what it checks and its own explicit false-positive/negative escape
      # hatch (`// timeout-guard-ignore: <reason>`).
      - name: Check timeout guards on DB call sites
        run: deno run --allow-read scripts/check-timeout-guards.ts

      - name: Test timeout-guard checker itself
        run: deno test --allow-read scripts/

      # Only supabase/functions/_shared/ has test coverage so far (2026-09-16)
      # — cors.ts, secret-auth.ts, rate-limit.ts, gemini.ts's pure
      # classification/pricing helpers. These are consolidated modules used
      # by all 10 edge functions, previously verified only by hand (prod
      # logs / manual curl) after every change. --no-check skips
      # type-checking: gemini.ts's jsr:@supabase/supabase-js@2 import
      # resolves to a newer minor version here than whatever Supabase's own
      # deploy pipeline uses, which trips an unrelated pre-existing type
      # mismatch (PromiseLike vs Promise on the RPC builder) that doesn't
      # reflect a real runtime bug — Supabase's deploy step doesn't
      # type-check either, so this matches how the code actually ships.
      - name: Test shared edge function modules
        run: deno test --no-check --allow-net --allow-env supabase/functions/_shared
